name: Build Forge mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '16'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.3'
      - name: Build mod
        run: gradle build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Masterme4a-ItemScroller-Forge-1.17.1
          path: build/libs/*.jar
          if-no-files-found: error
